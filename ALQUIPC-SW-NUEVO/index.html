<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ALQUIPC - Facturación de Alquiler de Equipos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <header>
      <h1>ALQUIPC</h1>
      <p>Sistema de Facturación - Alquiler de Equipos de Cómputo</p>
    </header>

    <form id="formFactura">

      <div class="campo">
        <label for="nombre">Nombre del cliente:</label>
        <input type="text" id="nombre" placeholder="Nombre y apellido" required>
      </div>

      <div class="campo">
        <label for="equipos">Número de equipos a alquilar (mínimo 2):</label>
        <input type="number" id="equipos" min="2" value="2" required>
      </div>

      <div class="campo">
        <label for="dias">Número de días iniciales de alquiler:</label>
        <input type="number" id="dias" min="1" value="1" required>
      </div>

      <div class="campo">
        <label>Opción de alquiler:</label>
        <div class="opciones">
          <label><input type="radio" name="opcion" value="ciudad" checked> Dentro de la ciudad</label>
          <label><input type="radio" name="opcion" value="fuera"> Fuera de la ciudad (+5% domicilio)</label>
          <label><input type="radio" name="opcion" value="establecimiento"> Dentro del establecimiento (-5% descuento)</label>
        </div>
      </div>

      <div class="campo">
        <label for="diasAdicionales">Días adicionales (opcional):</label>
        <input type="number" id="diasAdicionales" min="0" value="0">
      </div>

      <div class="campo">
        <label for="correo">Correo electrónico del cliente (para envío del recibo):</label>
        <input type="email" id="correo" placeholder="cliente@correo.com" required>
      </div>

      <button type="submit">Generar Factura</button>
    </form>

    <div id="resultado" class="resultado oculto"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
